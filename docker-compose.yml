version: '3.8'

services:

  backend:
    container_name: kimfe-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./backend/:/app/
    entrypoint: /app/run.sh
    # Path: backend
    # backend/llama-run.sh -f deploy.py 

  frontend:
    container_name: kimfe-frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./src/:/app/src
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000