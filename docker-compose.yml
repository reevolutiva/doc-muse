version: '3.8'

services:

  backend:
    container_name: kimfe-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./backend/:/app/
    entrypoint: sh -c "chmod +x /app/run.sh && chmod +x /app/llama-run.sh && /app/run.sh"

  frontend:
    container_name: kimfe-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./src/:/app/src
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      # Eliminado el volumen node_modules que sobreescribe la instalación global
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 5s